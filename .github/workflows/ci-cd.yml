name: Build & Deploy to Amazon EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  NAMESPACE: ${{ secrets.K8S_NAMESPACE }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      ####################################################
      # Checkout Repository
      ####################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Configure AWS Credentials
      ####################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      
      # Verify AWS Identity
      ####################################################
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      ####################################################
      # Login to Amazon ECR
      ####################################################
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ####################################################
      # Verify Repository Structure
      ####################################################
      - name: Verify Repository Structure
        run: |
          pwd
          ls -la
          ls -la backend
          ls -la frontend
          ls -la darknotes

      ####################################################
      # Build Backend
      ####################################################
      - name: Build Backend Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          cd backend

          docker build \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            .

          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      ####################################################
      # Build Frontend
      ####################################################
      - name: Build Frontend Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          set -euo pipefail

          cd frontend

          docker build \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" \
            .

          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"

      ####################################################
      # Debug EKS
      ####################################################
      - name: Debug EKS
        run: |
          echo "AWS_REGION=[$AWS_REGION]"
          echo "CLUSTER_NAME=[$CLUSTER_NAME]"
          echo "NAMESPACE=[$NAMESPACE]"

          aws sts get-caller-identity

          aws eks list-clusters \
            --region "$AWS_REGION"

          aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"

      ####################################################
      # Configure kubectl
      ####################################################
      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"

      ####################################################
      # Verify kubectl
      ####################################################
      - name: Verify kubectl
        run: |
          kubectl config current-context
          kubectl get nodes

      ####################################################
      # Helm Deploy
      ####################################################
      - name: Deploy using Helm
        run: |
          helm upgrade --install darknotes ./darknotes \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set backend.image.repository="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPOSITORY }}" \
            --set backend.image.tag="${{ github.sha }}" \
            --set frontend.image.repository="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPOSITORY }}" \
            --set frontend.image.tag="${{ github.sha }}" \
            --set secret.supabaseUrl="${{ secrets.SUPABASE_URL }}" \
            --set secret.supabaseServiceRoleKey="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      ####################################################
      # Verify Deployment
      ####################################################
      - name: Verify Deployment
        run: |
          kubectl get all -n "$NAMESPACE"
          kubectl get ingress -n "$NAMESPACE"
