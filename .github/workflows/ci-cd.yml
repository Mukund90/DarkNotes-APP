  ####################################################
  # DEPLOY JOB
  ####################################################
  deploy:
    name: Deploy to Amazon EKS

    needs: push

    runs-on: self-hosted

    permissions:
      contents: read

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Debug EKS
        run: |
          echo "AWS_REGION=[$AWS_REGION]"
          echo "CLUSTER_NAME=[$CLUSTER_NAME]"
          echo "NAMESPACE=[$NAMESPACE]"

          aws sts get-caller-identity

          aws eks list-clusters \
            --region "$AWS_REGION"

          aws eks describe-cluster \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name "$CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Verify kubectl
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Helm Deploy
        run: |
          helm upgrade --install darknotes ./darknotes \
            --namespace "$NAMESPACE" \
            --create-namespace \
            --set backend.image.repository="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_BACKEND_REPOSITORY }}" \
            --set backend.image.tag="${{ github.sha }}" \
            --set frontend.image.repository="${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_FRONTEND_REPOSITORY }}" \
            --set frontend.image.tag="${{ github.sha }}" \
            --set secret.supabaseUrl="${{ secrets.SUPABASE_URL }}" \
            --set secret.supabaseServiceRoleKey="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      - name: Verify Deployment
        run: |
          kubectl get all -n "$NAMESPACE"
          kubectl get ingress -n "$NAMESPACE"
