name: Build & Deploy to Kind

on:
  push:
    branches:
      - main

env:
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}

jobs:

  ####################################################
  # BUILD JOB
  ####################################################
  build:
    name: Build Docker Images
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Repository Structure
        run: |
          pwd
          ls -la
          ls -la backend
          ls -la frontend
          ls -la darknotes

      ####################################################
      # Build Backend Image
      ####################################################

      - name: Build Backend Image
        run: |
          docker build \
            -t mudocker67/darknotes-backend:${{ github.sha }} \
            -t mudocker67/darknotes-backend:latest \
            ./backend

      ####################################################
      # Build Frontend Image
      ####################################################

      - name: Build Frontend Image
        run: |
          docker build \
            -t mudocker67/darknotes-frontend:${{ github.sha }} \
            -t mudocker67/darknotes-frontend:latest \
            ./frontend

      ####################################################
      # Save Docker Images
      ####################################################

      - name: Save Backend Image
        run: |
          docker save \
            -o backend.tar \
            mudocker67/darknotes-backend:${{ github.sha }}

      - name: Save Frontend Image
        run: |
          docker save \
            -o frontend.tar \
            mudocker67/darknotes-frontend:${{ github.sha }}

      ####################################################
      # Upload Artifacts
      ####################################################

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend.tar

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: frontend.tar

  ####################################################
  # PUSH JOB
  ####################################################
  push:
    name: Push Images to Docker Hub
    needs: build
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      ####################################################
      # Download Backend Image
      ####################################################

      - name: Download Backend Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-image

      ####################################################
      # Download Frontend Image
      ####################################################

      - name: Download Frontend Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image

      ####################################################
      # Load Docker Images
      ####################################################

      - name: Load Backend Image
        run: docker load -i backend.tar

      - name: Load Frontend Image
        run: docker load -i frontend.tar

      ####################################################
      # Login Docker Hub
      ####################################################

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWD }}

      ####################################################
      # Push Backend Image
      ####################################################

      - name: Push Backend Image
        run: |
          docker push mudocker67/darknotes-backend:${{ github.sha }}
          docker push mudocker67/darknotes-backend:latest

      ####################################################
      # Push Frontend Image
      ####################################################

      - name: Push Frontend Image
        run: |
          docker push mudocker67/darknotes-frontend:${{ github.sha }}
          docker push mudocker67/darknotes-frontend:latest

  ####################################################
  # DEPLOY JOB
  ####################################################
  deploy:
    name: Deploy to Kind Cluster
    needs: push
    runs-on: self-hosted

    permissions:
      contents: read

    steps:
      ####################################################
      # Checkout Repository
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Verify Kubernetes Context
      ####################################################

      - name: Verify Kubernetes Context
        run: |
          echo "Current Context:"
          kubectl config current-context

          echo ""
          echo "Cluster Information:"
          kubectl cluster-info

          echo ""
          echo "Nodes:"
          kubectl get nodes

      ####################################################
      # Verify Helm
      ####################################################

      - name: Verify Helm
        run: |
          helm version
          kubectl version

      ####################################################
      # Deploy using Helm
      ####################################################

      - name: Helm Upgrade / Install
        run: |
          helm upgrade --install darknotes ./darknotes \
            --namespace ${{ env.K8S_NAMESPACE }} \
            --create-namespace \
            --set backend.image.repository=mudocker67/darknotes-backend \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=mudocker67/darknotes-frontend \
            --set frontend.image.tag=${{ github.sha }} \
            --set secret.supabaseUrl="${{ secrets.SUPABASE_URL }}" \
            --set secret.supabaseServiceRoleKey="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      ####################################################
      # Wait for Backend Deployment
      ####################################################

      - name: Wait for Backend Rollout
        run: |
          kubectl rollout status deployment/darknotes-backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      ####################################################
      # Wait for Frontend Deployment
      ####################################################

      - name: Wait for Frontend Rollout
        run: |
          kubectl rollout status deployment/darknotes-frontend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=180s

      ####################################################
      # Verify Pods
      ####################################################

      - name: Verify Pods
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide

      ####################################################
      # Verify Services
      ####################################################

      - name: Verify Services
        run: |
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}

      ####################################################
      # Verify Ingress
      ####################################################

      - name: Verify Ingress
        run: |
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}

      ####################################################
      # Describe Ingress
      ####################################################

      - name: Describe Ingress
        run: |
          kubectl describe ingress darknotes -n ${{ env.K8S_NAMESPACE }}

      ####################################################
      # Deployment Summary
      ####################################################

      - name: Deployment Summary
        run: |
          echo "========================================"
          echo "Deployment Successful"
          echo "========================================"
          echo ""
          echo "Namespace: ${{ env.K8S_NAMESPACE }}"
          echo ""
          echo "Frontend:"
          echo "http://darknotes.local"
          echo ""
          echo "Backend API:"
          echo "http://darknotes.local/api"
          echo ""
          echo "Pods:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "Services:"
          kubectl get svc -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "Ingress:"
          kubectl get ingress -n ${{ env.K8S_NAMESPACE }}
