apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "darknotes.fullname" . }}-backend
  labels:
    app: backend
    {{- include "darknotes.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: {{ include "darknotes.serviceAccountName" . }}

      containers:
        - name: backend

          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.backend.service.targetPort }}

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ include "darknotes.fullname" . }}-config
                  key: NODE_ENV

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "darknotes.fullname" . }}-config
                  key: PORT

            - name: API_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: {{ include "darknotes.fullname" . }}-config
                  key: API_PREFIX

            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "darknotes.fullname" . }}-secret
                  key: SUPABASE_URL

            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "darknotes.fullname" . }}-secret
                  key: SUPABASE_SERVICE_ROLE_KEY

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.targetPort }}
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 5