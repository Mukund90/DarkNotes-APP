apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "darknotes.fullname" . }}-config
  labels:
    {{- include "darknotes.labels" . | nindent 4 }}

data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.port | quote }}
  API_PREFIX: {{ .Values.config.apiPrefix | quote }}