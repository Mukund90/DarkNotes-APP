backend:
  replicaCount: 3

  image:
    repository: mudocker67/darknotes-backend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80
    targetPort: 5000

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

frontend:
  replicaCount: 3

  image:
    repository: mudocker67/darknotes-frontend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    port: 80
    targetPort: 80

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

config:
  nodeEnv: "production"
  port: "5000"
  apiPrefix: "/api"

secret:
  supabaseUrl: ""
  supabaseServiceRoleKey: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

ingress:
  enabled: true
  className: nginx

  annotations: {}
# Monitoring Stack Configurations
loki-distributed:
  enabled: true
  loki:
    auth_enabled: false

promtail:
  enabled: true
  config:
    clients:
      # Links Promtail directly to the Loki distributed gateway service inside the release
      - url: http://{{ .Release.Name }}-loki-distributed-gateway/loki/api/v1/push

grafana:
  enabled: true
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Loki
          type: loki
          access: proxy
          # Automatically adds Loki as a data source inside your new Grafana
          url: http://{{ .Release.Name }}-loki-distributed-gateway
          jsonData:
            maxLines: 1000
